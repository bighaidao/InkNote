name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            name: macOS
          - platform: windows-latest
            name: Windows
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: InkNote/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: InkNote
        run: pnpm install --frozen-lockfile

      # 本地无签名密钥，关掉 updater 工件签名（不影响 .app/dmg/exe 产出）
      - name: Build Tauri bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: InkNote
          # 打 tag 时发布到对应 Release；push 到 main 时仅构建并上传 artifact
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "InkNote ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}"
          releaseBody: "自动构建产物。macOS：.app / .dmg；Windows：NSIS 安装程序 (.exe)。"
          releaseDraft: true
          prerelease: false
          args: --config '{"bundle":{"createUpdaterArtifacts":false}}'
